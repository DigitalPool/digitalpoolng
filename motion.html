<!doctype html>
<html lang="en">
<head>
  <!-- @include head -->
  <title>Motion · DigitalPool</title>
  <meta name="description" content="Album art motion, lyric visuals and cover animations designed by DigitalPool." />
  <link rel="canonical" href="https://digitalpoolng.com/motion" />

<body data-page="motion">
  <!-- @include overlays -->
  <!-- @include header -->
  <main id="main">
    <section class="page-head wrap">

    </section>
    <section class="wrap" style="padding-bottom:clamp(80px,12vw,180px)">
      <div class="mgrid" id="mgrid"></div>
    </section>

    <section class="wrap" id="logos" style="padding-bottom:clamp(80px,12vw,180px)">
      <div class="sec-head">
        <h2 class="h2" data-split>Logo &amp; preloader <em>motion</em></h2>
        <p class="lead" data-reveal>Marks that come alive: logo reveals, loaders and mascot loops, built to play in a second or two.</p>
      </div>
      <div class="lgrid" id="lgrid"></div>
    </section>
