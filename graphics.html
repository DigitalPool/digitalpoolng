<!doctype html>
<html lang="en">
<head>
  <!-- @include head -->
  <title>Graphics · DigitalPool</title>
  <meta name="description" content="Brand identity, flyers, packaging, album art and campaign graphics designed by DigitalPool." />
  <link rel="canonical" href="https://digitalpoolng.com/graphics" />
  <meta property="og:title" content="Graphics · DigitalPool" />
  <meta property="og:url" content="https://digitalpoolng.com/graphics" />
  <script type="module" src="/src/pages/graphics.js"></script>
</head>
<body data-page="graphics" class="no-scroll">
  <!-- @include overlays -->
  <!-- @include header -->
  <main id="main">
    <section class="gfx" id="gfx" data-cursor="Drag" aria-label="Graphic design archive. Drag or scroll in any direction to explore.">
      <div class="gfx__plane" id="plane"></div>
      <div class="gfx__vign"></div>
      <div class="gfx__ui">
        <h1 class="gfx__title" data-split>Graph<em style="font-family:var(--f-serif);font-style:italic;font-weight:400;color:var(--red);letter-spacing:-0.02em">ics</em></h1>
        <div class="gfx__card" data-reveal>
          <span class="eyebrow">Archive · <span id="gCount"></span> pieces</span>
          <p>Brand identity, flyers, packaging, campaign art and album covers. Drag, scroll or swipe in any direction. Click a piece to open it.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="pill pill--red" href="/contact" data-magnetic><span>Start a project</span></a>
            <a class="pill pill--ghost" href="https://www.flickr.com/photos/186664939@N06/" target="_blank" rel="noopener"><span>Flickr ↗</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
