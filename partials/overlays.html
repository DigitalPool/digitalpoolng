<div class="cursor" aria-hidden="true">
  <div class="cursor__ring"><span class="cursor__label"></span></div>
  <div class="cursor__dot"></div>
</div>

<div class="tx" aria-hidden="true">
  <svg class="tx__svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="tx__path" d="M0 100 L100 100 L100 100 L0 100 Z" /></svg>
  <div class="tx__mark"><img src="/assets/brand/logo.png" alt="" width="64" height="64" /></div>
</div>

<div class="pl" id="pl" aria-hidden="true">
  <div class="pl__top mono"><span>DigitalPool</span><span>Creative technology studio</span></div>
  <div class="pl__logo">
    <img class="pl__ghost" src="/assets/brand/logo.png" alt="" />
    <div class="pl__fill"><img src="/assets/brand/logo.png" alt="" /></div>
    <svg class="pl__wave" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10 V 20 H 0 Z" /></svg>
  </div>
  <div class="pl__bottom">
    <div class="pl__words mono"><span>Diving in</span></div>
    <div class="pl__count"><span class="pl__num">0</span><sup>%</sup></div>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Media viewer" aria-hidden="true">
  <div class="modal__bg" data-close></div>
  <div class="modal__stage"></div>
  <button class="modal__close pill" type="button" data-close data-magnetic><span>Close</span></button>
  <div class="modal__nav">
    <button class="pill pill--ghost" type="button" data-prev aria-label="Previous"><span>←</span></button>
    <span class="modal__count mono"></span>
    <button class="pill pill--ghost" type="button" data-next aria-label="Next"><span>→</span></button>
  </div>
</div>

<div class="toast mono" role="status" aria-live="polite"></div>
